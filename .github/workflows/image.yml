name: image

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=pr
            type=sha,format=short,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Built into the local daemon first so the smoke test gates the push.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: claude-remote:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: github_token=${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test
        run: >-
          docker run --rm --entrypoint /usr/local/libexec/claude-remote/smoke-test
          claude-remote:ci

      # Fork PRs get a read-only token, so only same-repo refs publish.
      - if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          secrets: github_token=${{ secrets.GITHUB_TOKEN }}

  cleanup:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      # GHCR deletes by version id; only a version tagged pr-N alone goes, so
      # an image later retagged latest survives the PR that built it.
      - name: Delete the PR image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PKG: ${{ github.event.repository.name }}
          TAG: pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          ids=$(gh api --paginate "/users/$OWNER/packages/container/$PKG/versions" \
            --jq ".[] | select(.metadata.container.tags == [\"$TAG\"]) | .id")
          for id in $ids; do
            gh api --method DELETE "/users/$OWNER/packages/container/$PKG/versions/$id"
            echo "deleted version $id ($TAG)"
          done
