name: image

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.tag }}
      previous: ${{ steps.version.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Tags and history, to work out the next version on main.
          fetch-depth: 0

      # Every push to main is a release. Conventional Commits since the last
      # vX.Y.Z pick the bump: breaking is major (minor while 0.x), feat is
      # minor, anything else is a patch.
      - id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          last=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -z "$last" ]; then
            echo "tag=v0.1.0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -n "$(git tag --points-at HEAD)" ]; then
            echo "HEAD is already tagged: $(git tag --points-at HEAD)"; exit 0
          fi
          log=$(git log --format='%s%n%b' "$last..HEAD")
          IFS=. read -r major minor patch <<<"${last#v}"
          if grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING CHANGE' <<<"$log"; then
            if [ "$major" = 0 ]; then minor=$((minor + 1)); else major=$((major + 1)); minor=0; fi
            patch=0
          elif grep -qE '^feat(\([^)]*\))?:' <<<"$log"; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          echo "previous=$last" >> "$GITHUB_OUTPUT"
          echo "tag=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=pr
            type=sha,format=short,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.tag }},enable=${{ steps.version.outputs.tag != '' }}

      # Built once into the local daemon, with the publish tags too: the image
      # the tests pass is the one pushed, never a rebuild.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: |
            claude-remote:ci
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: github_token=${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test
        run: >-
          docker run --rm --entrypoint /usr/local/libexec/claude-remote/smoke-test
          claude-remote:ci

      # The real entrypoint: a host key uid 1000 can read stops it, a
      # root-only one lets a key run `ssh host cmd` as $USER with the home
      # seeded and the profile loaded. sshd drops the image's ENV, so each of
      # these values can only come from profile.d.
      - name: SSH login
        run: |
          set -euo pipefail
          d=$(mktemp -d)
          install -d "$d/hk" "$d/ak"
          ssh-keygen -q -t ed25519 -N '' -f "$d/hk/ssh_host_ed25519_key"
          ssh-keygen -q -t ed25519 -N '' -f "$d/client"
          cp "$d/client.pub" "$d/ak/authorized_keys"
          mounts=(-v "$d/hk:/mnt/claude-remote/hostkey:ro"
            -v "$d/ak:/mnt/claude-remote/authorized-keys:ro")

          chmod 0644 "$d/hk/ssh_host_ed25519_key"
          if out=$(docker run --rm -e USER=ci "${mounts[@]}" claude-remote:ci 2>&1); then
            echo "::error::started with a host key uid 1000 can read"; exit 1
          fi
          grep -q 'readable by uid 1000' <<<"$out" || { echo "$out"; exit 1; }

          sudo chown 0:0 "$d/hk/ssh_host_ed25519_key"
          sudo chmod 0400 "$d/hk/ssh_host_ed25519_key"
          # A fresh volume below the home mounts root-owned, like a new PVC.
          docker run -d --name sshd -p 2222:2222 -e USER=ci "${mounts[@]}" \
            -e KUBERNETES_SERVICE_HOST=10.96.0.1 -e KUBERNETES_SERVICE_PORT=443 \
            -v ci-project:/home/ci/dev/project claude-remote:ci
          trap 'docker logs sshd; docker rm -f sshd >/dev/null' EXIT
          for _ in $(seq 30); do
            ssh-keyscan -p 2222 127.0.0.1 >/dev/null 2>&1 && break
            sleep 1
          done
          ssh -i "$d/client" -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null ci@127.0.0.1 \
            'test "$(id -un)" = ci && test -s ~/.config/ccstatusline/settings.json &&
            helm plugin list | grep -q ^diff && command -v node | grep -q /mise/shims/ &&
            test "$XDG_CACHE_HOME" = /var/cache/claude-remote && brew --version &&
            test "$KUBERNETES_SERVICE_HOST:$KUBERNETES_SERVICE_PORT" = 10.96.0.1:443 &&
            touch ~/dev/project/written'

      # Fork PRs get a read-only token, so only same-repo refs publish, and a
      # manual run on a branch has no tag to push.
      - if: >-
          steps.meta.outputs.tags != '' && (
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested image
        if: >-
          steps.meta.outputs.tags != '' && (
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          echo "tested image: $(docker image inspect --format '{{.Id}}' claude-remote:ci)"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            test "$(docker image inspect --format '{{.Id}}' "$tag")" = \
              "$(docker image inspect --format '{{.Id}}' claude-remote:ci)"
            docker push "$tag"
          done <<<"$TAGS"

  # Tag the commit and publish release notes only after the image is pushed,
  # so a release never names an image that does not exist.
  release:
    needs: build
    if: needs.build.outputs.version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.version }}
          PREV: ${{ needs.build.outputs.previous }}
        run: |
          set -euo pipefail
          notes="Image: \`${IMAGE}:${TAG}\` (also \`sha-${GITHUB_SHA::7}\`)"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --notes "$notes" --generate-notes ${PREV:+--notes-start-tag "$PREV"}

  cleanup:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      # GHCR deletes by version id; only a version tagged pr-N alone goes, so
      # an image later retagged latest survives the PR that built it.
      - name: Delete the PR image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PKG: ${{ github.event.repository.name }}
          TAG: pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          ids=$(gh api --paginate "/users/$OWNER/packages/container/$PKG/versions" \
            --jq ".[] | select(.metadata.container.tags == [\"$TAG\"]) | .id")
          for id in $ids; do
            gh api --method DELETE "/users/$OWNER/packages/container/$PKG/versions/$id"
            echo "deleted version $id ($TAG)"
          done
